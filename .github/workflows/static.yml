name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]          # push 到 main 时自动触发
  workflow_dispatch:            # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'       # 或 18、22，根据你的项目调整
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build        # 你的项目是 npm run build:pwa → build，但 predeploy 会自动执行 build

      - name: Deploy
        run: npm run deploy       # 执行 package.json 中的 "deploy": "gh-pages -d dist"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
